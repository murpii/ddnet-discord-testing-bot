# Example configuration. Copy this file to config.ini and fill in your own values.

[AUTH]
# Your Discord bot token (Developer Portal -> your app -> Bot -> Reset Token).
TOKEN_DISCORD = token

[DDNET]
# Master switch for all DDNet traffic.
# Keep off for local testing so nothing touches the live DDNet endpoints.
ENABLED = false

# API token for the DDNet upload/delete endpoints.
# Leave blank unless you have one.
TOKEN = token
UPLOAD = upload-point-url
DELETE = delete-point-url

[DATABASE]
# MariaDB/MySQL connection used by the bot.
MARIADB_USER = teeworlds
MARIADB_PASSWORD = password
MARIADB_DB = database
MARIADB_HOST = localhost ; default
MARIADB_PORT = 3306 ; default

[TESTING_CHANNELS]
# Map rendering (thumbnails + visual diffs) needs a GPU or a software rasterizer.
# Set to false on hosts without one: the bot then skips thumbnails and the visual-diff
# button, but the text diff summary still works.
RENDERING = true

# Automatic map checks shell out to the twmap-check / twmap-check-ddnet binaries in
# data/map-testing/. Set to false to skip the checks entirely
MAP_CHECKS = true

# Comma-separated channel IDs to skip when loading testing channels
EXCLUDE = 111111,222222,333333

CATEGORY_CHANNEL_LIMIT = 50
CATEGORY_AUTO_CREATE = true
CATEGORY_PRUNE_EMPTY = false
# Categories that don't follow the naming scheme, added to a state anyway.
# Normally empty, the name matching above covers it.
EXTRA_CATEGORIES_TESTING =
EXTRA_CATEGORIES_WAITING =
EXTRA_CATEGORIES_EVALUATED =

# Where archived testlogs are written, in the layout the ddnet-map-testing-log
TESTLOG_DIR = data/map-testing/testlogs

# Also push the archived testlog + assets to the DDNet upload endpoint.
# Keep off for local testing.
TESTLOG_UPLOAD = false

# Keep off while testing so archiving doesn't destroy the channel.
TESTLOG_DELETE_ON_ARCHIVE = false

# Housekeeping timings, all in days.
# How long a released map channel stays open for final fixes.
GRACE_PERIOD_DAYS = 14
# Warn the mapper this long before a released maps grace period ends.
GRACE_WARNING_LEAD_DAYS = 2
# Archive a released channel this long after its grace period ended.
GRACE_ARCHIVE_BUFFER_DAYS = 3
# Quiet time in WAITING before the mapper gets the inactivity prompt.
WAITING_QUIET_AFTER_DAYS = 14
# Archive when the inactivity prompt gets no response for this long.
PROMPT_NO_RESPONSE_AFTER_DAYS = 7
# Archive when the channel stays quiet this long after a response.
QUIET_AFTER_RESPONSE_DAYS = 30